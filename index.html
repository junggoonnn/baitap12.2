<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
    <div class="box logo">Logo</div>
    <div class="box menu">Menu</div>
    <div class="box button">Button</div>
  </header>

    <section class="hero-section">
        <div class="hero-container">
            <div class="box content">Content</div>
            <div class="box image">Image</div>      
        </div>
    </section>

    <section class="main-section">
        <div class="box title">Title</div>
            <div class="items-grid">
                <div class="box item">Item</div>
                <div class="box item">Item</div>
                <div class="box item">Item</div>
                <div class="box item">Item</div>
                <div class="box item">Item</div>
                <div class="box item">Item</div>
            </div>
    </section>

    <section class="feature-section">
        <div class="box title">Title</div>
        <div class="items-5-grid">
            <div class="box item2">Item</div>
            <div class="box item2">Item</div>
            <div class="box item2">Item</div>
            <div class="box item2">Item</div>
            <div class="box item2">Item</div>
        </div>
    </section>

    <section class="gallery-section">
        <div class="box title">Title</div>
        <div class="items-4-grid">
            <div class="box item">Item</div>
            <div class="box item">Item</div>
            <div class="box item">Item</div>
            <div class="box item">Item</div>
        </div>
    </section>

    <footer class="box footer">Footer</footer>
</body>
